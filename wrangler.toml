name = "kraken-interview"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "website/dist"

[build]
command = "npm run build:pages"

[[r2_buckets]]
binding = "INSTALLERS"
bucket_name = "kraken-installers"

[[kv_namespaces]]
binding = "DEVICES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
